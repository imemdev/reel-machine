<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Reel Machine — Your reels, ready to read.</title>
  <desc id="desc">A dark blue banner with mint accents illustrating a video becoming an audio waveform and editable transcript. A local workspace for Tunisian Arabic video transcripts.</desc>
