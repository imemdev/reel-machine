    <text x="56" y="238" fill="#A2F2D2" font-size="62" font-weight="750" letter-spacing="-2.8">Ready to read.</text>
    <text x="59" y="281" fill="#ACBDCE" font-size="19">A local workspace for Tunisian Arabic video transcripts.</text>

