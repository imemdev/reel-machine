      <stop stop-color="#101C30"/>
      <stop offset="1" stop-color="#172D43"/>
    </linearGradient>
    <linearGradient id="cover" x1="784" y1="109" x2="918" y2="317" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F7680"/>
      <stop offset="1" stop-color="#213B5A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9ACBD5" stroke-opacity="0.07"/>
    </pattern>
  </defs>
