[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tunisian-video-library-local"
version = "0.1.0"
description = "Local-only social video library and Tunisian Arabic transcript workspace"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.1.4",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.12.5",
]

[project.optional-dependencies]
downloads = [
  # [default] adds the YouTube challenge solver (yt-dlp-ejs).
  "yt-dlp[default]",
  "gallery-dl==1.32.12",
]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]
faruk = [
  "torch>=2.0,<3",
  "transformers>=4.45,<6",
  "accelerate>=0.34,<2",
  "safetensors>=0.4,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
where = ["backend"]
